<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/5751f2b9e6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/mitmeleheline_hotelli_veebileht/css/style.css">
    <title>Hotell | Kontakt</title>
</head>
<body>

    <header>
        <nav id="navbar">
            <div class="container">
                <div class="logo"><a href="index.html">markhardikov.ee</a></div>
                <ul>
                    <li><a href="index.html">Minu kohta</a></li>
                    <li><a href="sarjad.html" class="nav-btn">Kontakt</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section id="contact-form" class="py-30">
        <div class="container">
            <h1>Kui sul on midagi öelda siis kirjuta</h1>

            <form action="">
                <div class="form-group">
                    <label for="name">Nimi:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-post:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Sõnum:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn">Saada</button>
            </form>
        </div>
    </section>

    <section id="contact-info" class="bg-gray">
        <div class="container">
            <div class="box bg-dark">
                <i class="fas fa-map-marker-alt"></i>
                <h3>Aadress</h3>
                <p>Tartu</p>
            </div>
            <div class="box bg-dark">
                <i class="fas fa-phone"></i>
                <h3>Telefon</h3>
                <p>+1 234 567 890</p>
            </div>
            <div class="box">
                <i class="fas fa-envelope"></i>
                <h3>E-post</h3>
                <p>mark.hardikov@voco.ee</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Mark Hardikov Kõik õigused kaitstud.</p>
    </footer>

</body>
</html>
